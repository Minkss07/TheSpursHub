<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad — Spurs Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav class="sidebar" id="sidebar">
        <a href="index.html">Home</a>
        <a href="club.html" class="active">Squad</a>
        <a href="news.html">Spurs News</a>
    </nav>

    <header>
        <p class="eyebrow">N17 · Est. 1882</p>
        <h1>Squad</h1>
        <p class="subtitle">2026/27 First Team</p>
    </header>

    <div id="club-crest" style="display:flex; justify-content:center; margin-top:6px; margin-bottom:26px;"></div>

    <section>
        <h2>Manager</h2>
        <div class="stat-box">
            <div class="stat-value" style="font-size:1.2rem;">Roberto De Zerbi</div>
            <div class="stat-label">Head Coach</div>
        </div>
    </section>

    <section>
        <h2>Attack</h2>
        <p class="kickoff-line" style="margin-bottom:10px;">Tap a player for their profile</p>
        <div id="squad-att"></div>
    </section>

    <section>
        <h2>Central Midfield</h2>
        <p class="kickoff-line" style="margin-bottom:10px;">Tap a player for their profile</p>
        <div id="squad-cm"></div>
    </section>

    <section>
        <h2>Defence</h2>
        <p class="kickoff-line" style="margin-bottom:10px;">Tap a player for their profile</p>
        <div id="squad-def"></div>
    </section>

    <section>
        <h2>Goalkeepers</h2>
        <p class="kickoff-line" style="margin-bottom:10px;">Tap a player for their profile</p>
        <div id="squad-gk"></div>
    </section>

    <div class="modal-overlay" id="player-modal-overlay" onclick="closePlayerModal(event)">
        <div class="modal-box">
            <button class="modal-close" onclick="closePlayerModal()">×</button>
            <div id="player-modal-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById("club-crest").innerHTML = crestBadge("tottenham", 70);
        renderSquadSection("squad-att", "att");
        renderSquadSection("squad-cm", "cm");
        renderSquadSection("squad-def", "def");
        renderSquadSection("squad-gk", "gk");
    </script>

</body>
</html>
