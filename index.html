<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spurs Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222;
        }

        header {
            background-color: #132257; /* Tottenham navy */
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        section {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 15px;
            color: #1a1a2e;
        }

        #countdown {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            color: #132257; /* Tottenham navy */
        }

        .result {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .result:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Spurs Hub</h1>
        <p>Come On You Spurs — fixtures, results, and predictions</p>
    </header>

    <section>
        <h2>Next Fixture: Tottenham vs Getafe</h2>
        <p id="countdown">Loading...</p>
        <p style="text-align:center; margin-top:10px; color:#666;">Saturday 8 August 2026, 3:00pm — Friendly</p>
    </section>

    <section>
        <h2>Recent Results</h2>
        <div class="result"><span>vs Chelsea</span><span>2 - 1 W</span></div>
        <div class="result"><span>vs Sydney FC</span><span>1 - 1 (W 4-2 pens)</span></div>
        <div class="result"><span>vs Auckland FC</span><span>2 - 0 W</span></div>
    </section>

    <script>
        // Tottenham vs Getafe, Saturday 8 August 2026, 3:00pm
        const nextMatch = new Date("2026-08-08T15:00:00");

        function updateCountdown() {
            const now = new Date();
            const diff = nextMatch - now;

            if (diff <= 0) {
                document.getElementById("countdown").textContent = "Kick off!";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("countdown").textContent =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
