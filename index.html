<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spurs Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <nav class="sidebar" id="sidebar">
        <a href="index.html" class="active">Home</a>
        <a href="club.html">Club Info</a>
    </nav>

    <header>
        <h1>Spurs Hub</h1>
        <p>Come On You Spurs — fixtures, predictions, and results</p>
    </header>

    <section>
        <h2>Next Fixture</h2>
        <div class="fixture-teams" id="next-fixture-crests"></div>
        <p style="text-align:center; font-weight:bold;">Tottenham vs Getafe</p>
        <p id="countdown">Loading...</p>
        <p style="text-align:center; margin-top:10px; color:#666;">Saturday 8 August 2026, 3:00pm — Friendly</p>
    </section>

    <section class="predict-box">
        <h2>Predict the Score</h2>
        <div id="predict-form" class="predict-inputs">
            <span>Tottenham</span>
            <input type="number" id="predHome" min="0" value="0">
            <span>-</span>
            <input type="number" id="predAway" min="0" value="0">
            <span>Getafe</span>
        </div>
        <button id="predict-save-btn" style="margin-top:5px;">Save Prediction</button>
        <p class="predict-status" id="predict-status"></p>

        <div id="prediction-history" style="margin-top:20px; text-align:left;"></div>
        <p class="accuracy-summary" id="accuracy-summary"></p>
    </section>

    <section>
        <h2>Recent Results</h2>
        <p style="font-size:0.85rem; color:#888; margin-bottom:10px;">Tap a match for goals, assists, and lineups</p>
        <div id="recent-results-list"></div>
    </section>

    <div class="modal-overlay" id="match-modal-overlay" onclick="closeMatchModal(event)">
        <div class="modal-box">
            <button class="modal-close" onclick="closeMatchModal()">×</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const matchDate = "2026-08-08T15:00:00";
        startCountdown(matchDate);
        initPredictWidget("Getafe", matchDate);
        renderPredictionHistory();
        renderFixtureCrests("next-fixture-crests", "tottenham", "getafe");
        renderRecentResults();
    </script>

</body>
</html>
